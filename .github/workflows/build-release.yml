name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  # =========================================
  # Тестирование и линтинг
  # =========================================
  
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-qt

    - name: Run tests with coverage
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest tests/ -v --cov=. --cov-report=xml
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linter
      run: |
        pip install flake8 black isort mypy
    
    - name: Run linter
      run: |
        flake8 . --max-line-length=120 --ignore=E203,W503 --exclude=venv,dist,build

    - name: Run black check
      continue-on-error: true
      run: |
        black --check --line-length=100 . --exclude 'venv,dist,build'

    - name: Run type checking
      continue-on-error: true
      run: |
        mypy . --ignore-missing-imports --exclude venv --exclude dist --exclude build

  # =========================================
  # Сборка для разных платформ
  # =========================================
  
  build-windows:
    needs: [test]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller build.spec --clean --noconfirm
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: TTS_Lite_Windows
        path: dist/TTS_Lite/
        retention-days: 30

    - name: Build Windows installer
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
        $ver = "${{ github.ref_name }}".TrimStart('v')
        if (-not $ver) { $ver = "1.0.2" }
        & $iscc "installer.iss" "/DMyAppVersion=$ver"
        Get-ChildItem installer\*.exe | Format-Table Name,Length

    - name: Upload Windows installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: TTS_Lite_Windows_Setup
        path: installer/setup_TTS_Lite_*.exe
        retention-days: 30

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Install system libraries (Qt6 + audio)
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libasound2t64 \
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
          libfontconfig1 libfreetype6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller build.spec --clean --noconfirm
    
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: TTS_Lite_Linux
        path: dist/TTS_Lite/
        retention-days: 30

  build-macos:
    needs: [test]
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller build.spec --clean --noconfirm
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: TTS_Lite_macOS
        path: dist/TTS_Lite/
        retention-days: 30

  # =========================================
  # Создание релиза на GitHub
  # =========================================
  
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: TTS_Lite_Windows
        path: artifacts/windows

    - name: Download Windows installer
      uses: actions/download-artifact@v4
      with:
        name: TTS_Lite_Windows_Setup
        path: artifacts/windows-setup

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: TTS_Lite_Linux
        path: artifacts/linux

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: TTS_Lite_macOS
        path: artifacts/macos
    
    - name: Create archives
      run: |
        # Windows portable — zip без вложенной папки artifacts/windows
        powershell -Command "Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/TTS_Lite_Windows.zip -Force"
        tar -czvf artifacts/TTS_Lite_Linux.tar.gz -C artifacts/linux .
        tar -czvf artifacts/TTS_Lite_macOS.tar.gz -C artifacts/macos .
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/TTS_Lite_Windows.zip
          artifacts/TTS_Lite_Linux.tar.gz
          artifacts/TTS_Lite_macOS.tar.gz
          artifacts/windows-setup/*.exe
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
